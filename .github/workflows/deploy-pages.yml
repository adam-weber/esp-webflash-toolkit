name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build JS modules
        run: npm run build

      - name: Build documentation
        run: npx honkit build docs docs/_book
        continue-on-error: true

      - name: Prepare deploy folder
        run: |
          mkdir -p _site
          # Copy built docs as root (if they exist)
          if [ -d "docs/_book" ]; then
            cp -r docs/_book/* _site/
          fi
          # Copy examples and dist
          cp -r examples _site/
          cp -r dist _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
